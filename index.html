<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hermes Jobs Monitor</title>
    <style>
      /* ============ 科技感主题（参考 pointviewer） ============ */
      :root {
        color-scheme: dark;

        --bg: #05070d;
        --bg-2: #0a0f1c;
        --panel: rgba(20, 27, 45, 0.55);

        --ink: #e8ecf5;
        --muted: #8b94ad;
        --soft: #5e6680;

        --line: rgba(120, 140, 200, 0.16);
        --strong-line: rgba(140, 170, 255, 0.42);

        --accent: #00d9ff;
        --accent-2: #4f8cff;
        --accent-glow: rgba(0, 217, 255, 0.45);

        --pinned: #ff3d8a;
        --pinned-line: rgba(255, 61, 138, 0.5);

        --danger: #ff4d6a;
        --success: #2ee6a6;
        --warn: #d29922;

        font-family: "SF Mono", "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "Inter", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      html, body { height: 100%; }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
        position: relative;
      }

      body::before {
        content: "";
        position: fixed;
        inset: -20%;
        z-index: -2;
        background:
          radial-gradient(circle at 18% 22%, rgba(0, 217, 255, 0.12), transparent 42%),
          radial-gradient(circle at 82% 78%, rgba(255, 61, 138, 0.10), transparent 45%),
          radial-gradient(circle at 50% 50%, rgba(79, 140, 255, 0.06), transparent 60%),
          linear-gradient(180deg, #05070d 0%, #0a0f1c 100%);
        animation: bgDrift 22s ease-in-out infinite alternate;
      }

      body::after {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -1;
        background-image:
          linear-gradient(rgba(120, 140, 200, 0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(120, 140, 200, 0.04) 1px, transparent 1px);
        background-size: 48px 48px;
        mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
        -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
        pointer-events: none;
      }

      @keyframes bgDrift {
        0%   { transform: translate(0, 0) scale(1); }
        100% { transform: translate(-2%, 2%) scale(1.06); }
      }

      button, input { font: inherit; }

      .shell {
        width: min(1180px, calc(100vw - 44px));
        margin: 0 auto;
        padding: 48px 0 72px;
        position: relative;
        transform-origin: top center;
        transition: transform 0.2s ease;
      }

      /* 嵌入 iframe 模式：紧凑、撑满、关闭背景动画 */
      body.embedded .shell {
        width: 100%;
        padding: 20px 16px 32px;
      }
      body.embedded::before { animation: none; }
      body.embedded h1 { font-size: clamp(20px, 3vw, 32px); }
      body.embedded .kicker { font-size: 10px; margin-bottom: 4px; }
      body.embedded h2 { font-size: clamp(16px, 2.2vw, 22px); }
      body.embedded .panel { padding: 14px; border-radius: 12px; }
      body.embedded .row { padding: 9px 12px; }
      body.embedded button { min-height: 36px; padding: 0 16px; font-size: 12px; }

      h1, h2, h3, p { margin-top: 0; }

      h1 {
        margin-bottom: 0;
        font-size: clamp(40px, 5vw, 60px);
        line-height: 1.05;
        font-weight: 800;
        letter-spacing: -0.02em;
        background: linear-gradient(135deg, #ffffff 0%, #aeb9d6 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      h2 {
        margin-bottom: 0;
        font-size: 26px;
        letter-spacing: -0.01em;
        line-height: 1.12;
        font-weight: 750;
        color: var(--ink);
      }

      .kicker {
        margin: 0 0 8px;
        color: var(--accent);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        text-shadow: 0 0 12px var(--accent-glow);
      }

      button {
        min-height: 44px;
        border: 0;
        border-radius: 12px;
        padding: 0 22px;
        background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
        color: #021018;
        font-weight: 750;
        font-size: 14px;
        letter-spacing: 0.02em;
        cursor: pointer;
        position: relative;
        overflow: hidden;
        transition:
          transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1),
          box-shadow 0.2s ease,
          filter 0.2s ease;
        box-shadow: 0 4px 18px rgba(0, 217, 255, 0.25);
      }

      button::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(120deg, transparent 30%, rgba(255, 255, 255, 0.35) 50%, transparent 70%);
        transform: translateX(-120%);
        transition: transform 0.6s ease;
      }

      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 28px rgba(0, 217, 255, 0.4);
        filter: brightness(1.08);
      }

      button:hover::after { transform: translateX(120%); }
      button:active { transform: translateY(0); }

      button:disabled {
        cursor: wait;
        opacity: 0.5;
        transform: none;
        filter: grayscale(0.4);
        box-shadow: none;
      }

      .ghost {
        background: rgba(120, 140, 200, 0.06);
        border: 1px solid var(--line);
        color: var(--ink);
        box-shadow: none;
      }

      .ghost:hover {
        background: rgba(120, 140, 200, 0.12);
        border-color: var(--strong-line);
        box-shadow: 0 0 18px rgba(0, 217, 255, 0.12);
        filter: none;
      }

      .ghost::after { display: none; }

      /* ============ Topbar ============ */
      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 18px;
        margin-bottom: 44px;
        animation: fadeDown 0.5s ease both;
      }

      .top-actions {
        display: flex;
        gap: 12px;
        align-items: center;
      }

      .refresh-status {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
        font-weight: 600;
        text-align: right;
        min-height: 44px;
        display: flex;
        align-items: center;
        padding: 0 4px;
      }

      /* ============ 区块 ============ */
      .metric-section { margin-bottom: 44px; }

      .metric-section-head {
        display: flex;
        justify-content: space-between;
        align-items: end;
        gap: 14px;
        margin-bottom: 18px;
        animation: fadeDown 0.4s ease both;
      }

      .metric-section-head .head-meta {
        color: var(--muted);
        font-weight: 600;
        font-size: 13px;
        letter-spacing: 0.04em;
      }

      /* ============ 列表容器（玻璃面板） ============ */
      .list-panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
        overflow: hidden;
        animation: panelIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      /* ============ 列表行 ============ */
      .row {
        display: grid;
        align-items: center;
        gap: 14px;
        padding: 16px 22px;
        border-bottom: 1px solid rgba(120, 140, 200, 0.08);
        transition: background 0.18s ease;
      }

      .row:last-child { border-bottom: none; }

      .row:hover { background: rgba(0, 217, 255, 0.04); }

      /* 守护进程行：名称 | 备注 | 状态 | 运行时长 | PID/状态文本 */
      .row.daemon {
        grid-template-columns: minmax(120px, 1fr) minmax(80px, 1fr) auto auto auto;
      }

      .row .alias {
        color: var(--muted);
        font-size: 12px;
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        cursor: text;
        padding: 2px 6px;
        margin: -2px -6px;
        border-radius: 4px;
        border: 1px solid transparent;
        transition: border-color 0.15s, background 0.15s;
        outline: none;
        min-width: 60px;
      }

      .row .alias:hover {
        border-color: rgba(0, 217, 255, 0.3);
        background: rgba(0, 217, 255, 0.05);
      }

      .row .alias:focus {
        border-color: var(--accent);
        background: rgba(0, 217, 255, 0.08);
        box-shadow: 0 0 0 2px rgba(0, 217, 255, 0.15);
      }

      .row .alias[data-empty="true"]::before {
        content: "点击编辑";
        color: var(--muted);
        opacity: 0.4;
        font-style: italic;
      }

      .row .uptime {
        color: var(--accent);
        font-size: 12px;
        font-weight: 650;
        white-space: nowrap;
      }

      /* 任务行：名称 | 周期 | 推送 | 上次 | 下次 | 状态 */
      .row.job {
        grid-template-columns: minmax(160px, 1.4fr) auto auto auto auto auto;
      }

      .row .name {
        font-weight: 700;
        color: var(--ink);
        font-size: 14px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .row .meta {
        color: var(--muted);
        font-size: 12px;
        font-weight: 600;
      }

      .row .next-run { color: var(--accent); font-weight: 650; font-size: 12px; }
      .row .time { color: var(--muted); font-size: 12px; font-weight: 600; }
      .row .error-msg {
        color: var(--danger);
        font-size: 12px;
        max-width: 220px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-weight: 600;
      }

      /* 状态点 */
      .dot {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-weight: 700;
        font-size: 12px;
      }

      .dot::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: currentColor;
        box-shadow: 0 0 10px currentColor;
      }

      .dot.running { color: var(--success); }
      .dot.stale   { color: var(--warn); }
      .dot.stopped { color: var(--danger); }

      /* 标签 */
      .tag {
        display: inline-flex;
        align-items: center;
        padding: 4px 11px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.04em;
        border: 1px solid transparent;
        white-space: nowrap;
      }

      .tag-ok      { color: var(--success); background: rgba(46, 230, 166, 0.10); border-color: rgba(46, 230, 166, 0.32); }
      .tag-error   { color: var(--danger);  background: rgba(255, 77, 106, 0.10); border-color: rgba(255, 77, 106, 0.32); }
      .tag-warn    { color: var(--warn);    background: rgba(210, 153, 34, 0.10); border-color: rgba(210, 153, 34, 0.32); }
      .tag-info    { color: var(--accent);  background: rgba(0, 217, 255, 0.10); border-color: rgba(0, 217, 255, 0.32); }
      .tag-unknown { color: var(--muted);   background: rgba(120, 140, 200, 0.08); border-color: var(--line); }

      .empty {
        padding: 40px 22px;
        text-align: center;
        color: var(--soft);
        font-weight: 600;
        font-size: 13px;
      }

      /* ============ Toast ============ */
      .toast-message {
        position: fixed;
        top: 18px;
        left: 50%;
        z-index: 50;
        max-width: min(720px, calc(100vw - 32px));
        margin: 0;
        padding: 12px 18px;
        border: 1px solid var(--strong-line);
        border-radius: 12px;
        background: rgba(10, 15, 28, 0.92);
        color: var(--ink);
        font-size: 13px;
        font-weight: 650;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.5), 0 0 24px rgba(0, 217, 255, 0.15);
        backdrop-filter: blur(18px);
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, -22px);
        transition: opacity 0.25s ease, transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      .toast-message.show { opacity: 1; transform: translate(-50%, 0); }

      .toast-message.error {
        border-color: rgba(255, 77, 106, 0.4);
        color: var(--danger);
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.5), 0 0 24px rgba(255, 77, 106, 0.2);
      }

      /* ============ 动画 ============ */
      @keyframes panelIn {
        from { opacity: 0; transform: translateY(16px) scale(0.98); }
        to   { opacity: 1; transform: translateY(0) scale(1); }
      }

      @keyframes fadeDown {
        from { opacity: 0; transform: translateY(-10px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      /* ============ 响应式（手机端样式，由 body.force-mobile 触发） ============
         触发条件：URL 带 ?embed=mobile，或视口 ≤720px（由 JS 切换 class） */
      body.force-mobile .shell { width: 100%; padding: 18px 14px 36px; }
      body.force-mobile .topbar { flex-direction: column; align-items: stretch; gap: 12px; margin-bottom: 28px; }
      body.force-mobile .top-actions { justify-content: space-between; }
      body.force-mobile .refresh-status { text-align: left; font-size: 11px; min-height: 36px; }
      body.force-mobile h1 { font-size: 30px; }
      body.force-mobile h2 { font-size: 18px; }
      body.force-mobile .kicker { font-size: 10px; margin-bottom: 4px; }

      body.force-mobile .metric-section { margin-bottom: 24px; }
      body.force-mobile .metric-section-head { margin-bottom: 12px; }
      body.force-mobile .list-panel { border-radius: 14px; }

      /* 卡片式行：用 flex-wrap 自然换行，同一行的元素 flex-basis 配合 */
      body.force-mobile .row.daemon,
      body.force-mobile .row.job {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 12px;
        padding: 12px 14px;
      }

      /* === Daemon 行 === */
      body.force-mobile .row.daemon .name {
        flex: 1 1 auto;
        min-width: 0;
        font-size: 14px;
      }
      body.force-mobile .row.daemon .dot {
        flex: 0 0 auto;
        order: 0;
      }
      body.force-mobile .row.daemon .name { order: 0; }
      /* 备注占满一行 */
      body.force-mobile .row.daemon .alias {
        flex: 1 1 100%;
        order: 1;
        font-size: 12px;
        width: 100%;
        padding: 4px 8px;
        margin: 0;
      }
      /* 时长 + PID 同一行 */
      body.force-mobile .row.daemon .uptime {
        flex: 0 0 auto;
        order: 2;
        font-size: 11px;
      }
      body.force-mobile .row.daemon .meta {
        flex: 0 0 auto;
        order: 2;
        font-size: 11px;
        margin-left: 0;
      }

      /* === Job 行 ===
         第一行：任务名（整行）
         第二行：调度 | 推送 | 状态（同一行）
         第三行：上次执行 | 下次执行（两端对齐）
      */
      body.force-mobile .row.job .name {
        flex: 1 1 100%;
        order: 0;
        font-size: 14px;
        font-weight: 700;
        margin-bottom: 2px;
      }
      body.force-mobile .row.job .col-schedule { flex: 0 0 auto; order: 1; }
      body.force-mobile .row.job .col-deliver  { flex: 0 0 auto; order: 1; }
      body.force-mobile .row.job > span:last-child { flex: 0 0 auto; order: 1; }

      body.force-mobile .row.job .time     { flex: 0 0 auto; order: 2; font-size: 11px; }
      body.force-mobile .row.job .col-next { flex: 0 0 auto; order: 2; font-size: 11px; margin-left: auto; text-align: right; }

      body.force-mobile .row.job .col-schedule,
      body.force-mobile .row.job .col-deliver,
      body.force-mobile .row.job .time,
      body.force-mobile .row.job .col-next {
        display: inline-flex;
        align-items: center;
      }

      body.force-mobile .tag { font-size: 10px; padding: 3px 9px; }
      body.force-mobile button { min-height: 38px; padding: 0 16px; font-size: 12px; }

      /* toast 在手机上更靠上 */
      body.force-mobile .toast-message { top: 12px; font-size: 12px; max-width: calc(100vw - 24px); }

      /* 超小屏（≤380px）进一步压缩：仅实际视口触发 */
      @media (max-width: 380px) {
        body.force-mobile .shell { padding: 14px 10px 28px; }
        body.force-mobile h1 { font-size: 24px; }
        body.force-mobile h2 { font-size: 16px; }
        body.force-mobile .row.daemon,
        body.force-mobile .row.job { padding: 10px 12px; gap: 6px 10px; }
        body.force-mobile .tag { font-size: 9px; padding: 2px 7px; }
      }

      /* 滚动条 */
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(120, 140, 200, 0.2); border-radius: 6px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(0, 217, 255, 0.4); }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="kicker">Hermes</p>
          <h1>任务监控</h1>
        </div>
        <div class="top-actions">
          <p id="updateTime" class="refresh-status">等待加载…</p>
          <button id="refreshBtn" class="ghost" type="button" onclick="fetchAll()">⟳ 刷新</button>
        </div>
      </header>

      <section class="metric-section">
        <div class="metric-section-head">
          <div>
            <p class="kicker">Daemons</p>
            <h2>系统服务与守护进程</h2>
          </div>
        </div>
        <div class="list-panel" id="daemonList">
          <div class="empty">加载中…</div>
        </div>
      </section>

      <section class="metric-section">
        <div class="metric-section-head">
          <div>
            <p class="kicker">Cron</p>
            <h2>定时任务</h2>
          </div>
          <span class="head-meta" id="jobCount"></span>
        </div>
        <div class="list-panel" id="jobList">
          <div class="empty">加载中…</div>
        </div>
      </section>
    </main>

    <p id="errorBanner" class="toast-message error" role="alert" aria-live="polite"></p>

    <script>
      const API_BASE = '/api';
      let refreshing = false;
      let toastTimer = 0;

      // ─── 嵌入模式与缩放控制 ───────────────────────────────────
      const isInIframe = window.self !== window.top;
      let userScale = 1;  // 由 URL 参数或 postMessage 设置

      // URL 参数 ?scale=0.8
      (function initScale() {
        const params = new URLSearchParams(window.location.search);
        const s = parseFloat(params.get('scale'));
        if (s > 0 && s <= 2) userScale = s;
      })();

      // 嵌入模式自动启用
      if (isInIframe) document.body.classList.add('embedded');

      // ─── 手机端模式触发：?embed=mobile 或视口 ≤720px ──────────────
      const params = new URLSearchParams(window.location.search);
      const embedMobile = params.get('embed') === 'mobile';
      const mqMobile = window.matchMedia('(max-width: 720px)');
      function updateMobileMode() {
        document.body.classList.toggle('force-mobile', embedMobile || mqMobile.matches);
      }
      mqMobile.addEventListener('change', updateMobileMode);
      updateMobileMode();

      // 接收父窗口 postMessage: { type: 'setScale', scale: 0.8 }
      window.addEventListener('message', (e) => {
        const data = e.data || {};
        if (data.type === 'setScale' && typeof data.scale === 'number') {
          userScale = Math.max(0.3, Math.min(2, data.scale));
          applyScale();
        }
      });

      // 根据视口宽度自动计算适配缩放（嵌入模式下生效，但 embed=mobile 时不叠加）
      function computeFitScale() {
        if (!isInIframe) return 1;
        if (embedMobile) return 1;  // 已用手机端布局，不再缩放
        // 设计基准宽度 1100px，小于此值按比例缩小
        const baseWidth = 1100;
        const w = window.innerWidth;
        return w < baseWidth ? w / baseWidth : 1;
      }

      function applyScale() {
        const fit = computeFitScale();
        const finalScale = Math.min(fit, userScale);
        document.querySelector('.shell').style.transform = `scale(${finalScale})`;
        // 缩放后高度会变化，通知父窗口（iframe 自适应高度）
        if (isInIframe) {
          const h = document.body.scrollHeight;
          window.parent.postMessage({ type: 'resize', height: h, scale: finalScale }, '*');
        }
      }

      // 视口变化时重新缩放
      window.addEventListener('resize', applyScale);
      if (window.ResizeObserver) {
        new ResizeObserver(applyScale).observe(document.body);
      }

      function showToast(message, type = 'error', timeout = 3500) {
        const toast = document.getElementById('errorBanner');
        window.clearTimeout(toastTimer);
        toast.textContent = message;
        toast.className = `toast-message show ${type === 'error' ? 'error' : ''}`;
        toastTimer = window.setTimeout(() => toast.classList.remove('show'), timeout);
      }

      async function fetchAll() {
        if (refreshing) return;
        refreshing = true;
        const btn = document.getElementById('refreshBtn');
        btn.disabled = true;
        btn.textContent = '刷新中…';
        try {
          const [jobsRes, sysRes] = await Promise.all([
            fetch(`${API_BASE}/jobs`, { cache: 'no-store' }),
            fetch(`${API_BASE}/system`, { cache: 'no-store' })
          ]);
          const jobs = await jobsRes.json();
          const sys = await sysRes.json();
          renderDaemons(sys);
          renderJobs(jobs);
          document.getElementById('updateTime').textContent = `更新于 ${new Date().toLocaleTimeString('zh-CN')}`;
        } catch (e) {
          showToast('数据加载失败: ' + e.message);
        } finally {
          refreshing = false;
          btn.disabled = false;
          btn.textContent = '⟳ 刷新';
        }
      }

      // 保存中的服务名集合，避免重复提交
      const aliasSaving = new Set();

      async function saveAlias(name, alias) {
        if (aliasSaving.has(name)) return;
        aliasSaving.add(name);
        try {
          const res = await fetch(`${API_BASE}/alias`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, alias })
          });
          const data = await res.json();
          if (!data.ok) {
            showToast('备注保存失败: ' + (data.error || ''));
            return false;
          }
          return true;
        } catch (e) {
          showToast('备注保存失败: ' + e.message);
          return false;
        } finally {
          aliasSaving.delete(name);
        }
      }

      function renderDaemons(sys) {
        const list = document.getElementById('daemonList');
        const entries = Object.entries(sys);
        if (!entries.length) {
          list.innerHTML = '<div class="empty">暂无服务数据</div>';
          return;
        }
        list.innerHTML = '';
        // 按 PID 去重：相同 PID 只显示第一条
        const seenPids = new Set();
        const deduped = [];
        for (const [name, info] of entries) {
          if (info.pid) {
            if (seenPids.has(info.pid)) continue;
            seenPids.add(info.pid);
          }
          deduped.push([name, info]);
        }
        for (const [name, info] of deduped) {
          const row = document.createElement('div');
          row.className = 'row daemon';
          // 状态点：running 真活 / stale 假活 / stopped 已停止
          // systemd 服务有 state 字段；docker 容器用 running 布尔
          const st = info.state || (info.running ? 'running' : 'stopped');
          let dot;
          if (st === 'running')      dot = '<span class="dot running">运行中</span>';
          else if (st === 'stale')   dot = '<span class="dot stale">假活</span>';
          else                       dot = '<span class="dot stopped">已停止</span>';
          const pid = info.pid ? `<span class="meta">PID ${info.pid}</span>` : '';
          const statusExtra = info.status ? `<span class="meta">${info.status}</span>` : '';
          const alias = info.alias || '';
          const uptime = info.uptime ? `<span class="uptime">${info.uptime}</span>` : '<span class="meta">—</span>';
          row.innerHTML = `
            <span class="name">${info.desc || name}</span>
            <span class="alias" contenteditable="true" spellcheck="false" data-name="${name}" data-empty="${!alias}">${alias}</span>
            ${dot}
            ${uptime}
            <span class="meta">${pid ? pid + ' ' : ''}${statusExtra}</span>
          `;
          list.appendChild(row);
        }
        // 绑定 alias 编辑事件
        list.querySelectorAll('.alias').forEach(el => {
          const name = el.dataset.name;
          const finishEdit = async () => {
            const val = el.textContent.trim();
            el.dataset.empty = !val;
            // 仅在内容变化时保存
            if (val !== el.dataset.original) {
              const ok = await saveAlias(name, val);
              if (ok) {
                el.dataset.original = val;
                showToast('备注已保存', 'success');
              } else {
                // 恢复原值
                el.textContent = el.dataset.original || '';
                el.dataset.empty = !el.dataset.original;
              }
            }
          };
          el.addEventListener('focus', () => {
            el.dataset.original = el.textContent;
          });
          el.addEventListener('blur', finishEdit);
          el.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
              e.preventDefault();
              el.blur();
            } else if (e.key === 'Escape') {
              el.textContent = el.dataset.original || '';
              el.dataset.empty = !el.dataset.original;
              el.blur();
            }
          });
        });
      }

      function renderJobs(jobs) {
        const list = document.getElementById('jobList');
        document.getElementById('jobCount').textContent = jobs.length ? `${jobs.length} 个任务` : '';
        if (!jobs.length) {
          list.innerHTML = '<div class="empty">暂无定时任务</div>';
          return;
        }
        list.innerHTML = '';
        for (const job of jobs) {
          const row = document.createElement('div');
          row.className = 'row job';

          const status = job.last_status || 'unknown';
          const tagClass = status === 'ok' ? 'tag-ok' : status === 'error' ? 'tag-error' : 'tag-unknown';
          const statusLabel = {ok:'✓ 正常', error:'✕ 失败', unknown:'? 未知'}[status] || status;

          const lastRun = job.last_run_at ? timeAgo(job.last_run_at) : '从未';
          const nextRun = job.next_run_at ? formatTs(job.next_run_at) : '—';

          const deliverTag = job.deliver
            ? (job.deliver === 'local' ? 'tag-ok' : 'tag-warn')
            : 'tag-unknown';

          row.innerHTML = `
            <span class="name">${job.name}</span>
            <span class="col-schedule"><span class="tag tag-info">${scheduleDisplay(job.schedule)}</span></span>
            <span class="col-deliver"><span class="tag ${deliverTag}">${job.deliver || '—'}</span></span>
            <span class="time">${lastRun}</span>
            <span class="col-next next-run">${nextRun}</span>
            <span><span class="tag ${tagClass}">${statusLabel}</span></span>
          `;
          list.appendChild(row);
        }
      }

      function formatTs(ts) {
        if (!ts) return '—';
        const d = new Date(ts);
        return d.toLocaleString('zh-CN', {month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit'});
      }

      function timeAgo(ts) {
        if (!ts) return '从未';
        const diff = (Date.now() - new Date(ts).getTime()) / 1000;
        if (diff < 60) return '刚刚';
        if (diff < 3600) return Math.floor(diff/60) + ' 分钟前';
        if (diff < 86400) return Math.floor(diff/3600) + ' 小时前';
        return Math.floor(diff/86400) + ' 天前';
      }

      function scheduleDisplay(sched) {
        // 后端已将 schedule 转为可读字符串；此处做兜底
        if (!sched) return '—';
        if (typeof sched === 'string') return sched;
        return sched.display || sched.expr || '—';
      }

      // 初始加载
      applyScale();   // 先应用缩放，避免首次渲染抖动
      fetchAll();
      // 每 30 秒自动刷新
      setInterval(fetchAll, 30000);
      // 页面重新可见时自动刷新（切回标签页时立即拉取最新数据）
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) fetchAll();
      });
      // 窗口重新获得焦点时也刷新
      window.addEventListener('focus', fetchAll);
    </script>
  </body>
</html>
